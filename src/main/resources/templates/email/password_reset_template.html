<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Password Reset</title>
    <style>
        .email-container {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #e0e0e0;
            text-align: center;
        }
        .header {
            color: #2c3e50;
        }
        .reset-button {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .link-box {
            word-break: break-all;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
        }
        .footer-note {
            color: #7f8c8d;
            font-size: 14px;
        }
    </style>
</head>

<body>
<div class="email-container">
    <h2 class="header">Восстановление пароля</h2>
    <p>Мы получили запрос на сброс вашего пароля. Нажмите на кнопку ниже, чтобы создать новый пароль.</p>

    <div style="margin: 20px 0;">
        <a th:href="${link}" class="reset-button">
            Создать новый пароль
        </a>
    </div>

    <p>Если кнопка не работает, скопируйте и вставьте эту ссылку в браузер:</p>
    <p class="link-box" th:text="${link}">Link</p>

    <p class="footer-note">
        Если вы не запрашивали сброс пароля, пожалуйста, проигнорируйте это письмо.
    </p>
</div>
</body>

</html>
